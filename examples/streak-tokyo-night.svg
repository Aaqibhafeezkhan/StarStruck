<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 195" width="480" height="195" role="img" aria-label="GitHub Profile Card">
  <defs>
    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16161e" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#1a1b26" stop-opacity="0.98" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7aa2f7" />
      <stop offset="100%" stop-color="#bb9af7" />
    </linearGradient>

    <!-- XP Bar Gradient -->
    <linearGradient id="xpGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#bb9af7" />
      <stop offset="50%" stop-color="#7aa2f7" />
      <stop offset="100%" stop-color="#7dcfff" />
    </linearGradient>
  </defs>

  <style>
    .card-bg {
      fill: url(#cardGrad);
      stroke: #292e42;
      stroke-width: 1.5;
      rx: 16;
    }
    .text-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 700;
      fill: #7aa2f7;
      letter-spacing: -0.2px;
    }
    .text-subtitle {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      fill: #bb9af7;
    }
    .text-body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      fill: #c0caf5;
    }
    .text-muted {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      fill: #565f89;
    }
    .mono {
      font-family: "JetBrains Mono", "Fira Code", "Courier New", monospace;
    }
    .watermark {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 10px;
      font-weight: 600;
      fill: #565f89;
      opacity: 0.65;
      transition: opacity 0.2s ease;
    }
    .watermark:hover {
      opacity: 1;
      fill: #7aa2f7;
    }
    @keyframes pulse {
      0% { opacity: 0.7; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.05); }
      100% { opacity: 0.7; transform: scale(1); }
    }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    .cursor {
      animation: blink 1s infinite;
    }
    
  </style>

  <!-- Base Card -->
  <rect x="1" y="1" width="478" height="193" class="card-bg" />

  <!-- Inner Content -->
  
    <!-- Flame Badge & Main Streak -->
    <g transform="translate(32, 28)">
      <!-- Flame Icon Frame -->
      <g transform="translate(0, 4)">
        <circle cx="34" cy="34" r="34" fill="#16161e" stroke="#7aa2f7" stroke-width="2" filter="url(#glow)" />
        <text x="34" y="44" text-anchor="middle" font-size="32">🔥</text>
      </g>

      <!-- Streak Text -->
      <g transform="translate(86, 10)">
        <text x="0" y="24" class="text-title mono" font-size="34" font-weight="800">
          19 <tspan font-size="16" class="text-subtitle" font-weight="600">DAYS</tspan>
        </text>
        <text x="0" y="48" class="text-muted" font-size="13" font-weight="600">
          CURRENT COMMIT STREAK · @octocat
        </text>
      </g>
    </g>

    <!-- Sub-stats & Dots Bar -->
    <g transform="translate(32, 120)">
      <line x1="0" y1="0" x2="416" y2="0" stroke="#292e42" stroke-width="1" />
      <g transform="translate(0, 16)">
        <text x="0" y="12" class="text-subtitle" font-size="12" font-weight="600">Active Cycle</text>
        <!-- Activity Dots -->
        <g transform="translate(90, 4)">
          <circle cx="6" cy="6" r="5" fill="#7dcfff" stroke="#7aa2f7" stroke-width="1.5" /><circle cx="28" cy="6" r="5" fill="#7dcfff" stroke="#7aa2f7" stroke-width="1.5" /><circle cx="50" cy="6" r="5" fill="#7dcfff" stroke="#7aa2f7" stroke-width="1.5" /><circle cx="72" cy="6" r="5" fill="#7dcfff" stroke="#7aa2f7" stroke-width="1.5" /><circle cx="94" cy="6" r="5" fill="#7dcfff" stroke="#7aa2f7" stroke-width="1.5" /><circle cx="116" cy="6" r="5" fill="#16161e" stroke="#292e42" stroke-width="1.5" /><circle cx="138" cy="6" r="5" fill="#16161e" stroke="#292e42" stroke-width="1.5" /><circle cx="160" cy="6" r="5" fill="#16161e" stroke="#292e42" stroke-width="1.5" /><circle cx="182" cy="6" r="5" fill="#16161e" stroke="#292e42" stroke-width="1.5" /><circle cx="204" cy="6" r="5" fill="#16161e" stroke="#292e42" stroke-width="1.5" /><circle cx="226" cy="6" r="5" fill="#16161e" stroke="#292e42" stroke-width="1.5" /><circle cx="248" cy="6" r="5" fill="#16161e" stroke="#292e42" stroke-width="1.5" /><circle cx="270" cy="6" r="5" fill="#16161e" stroke="#292e42" stroke-width="1.5" /><circle cx="292" cy="6" r="5" fill="#16161e" stroke="#292e42" stroke-width="1.5" />
        </g>
      </g>
    </g>
  

  <!-- Watermark & Backlink -->
  
      <g transform="translate(360, 177)">
        <a href="https://github.com/AkulTyagi/StarStruck" target="_blank">
          <text class="watermark" x="0" y="0">⚡ StarStruck</text>
        </a>
      </g>
    
</svg>