<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 270" width="540" height="270" role="img" aria-label="GitHub Profile Card">
  <defs>
    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181825" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#1e1e2e" stop-opacity="0.98" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cba6f7" />
      <stop offset="100%" stop-color="#89b4fa" />
    </linearGradient>

    <!-- XP Bar Gradient -->
    <linearGradient id="xpGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#89b4fa" />
      <stop offset="50%" stop-color="#cba6f7" />
      <stop offset="100%" stop-color="#a6e3a1" />
    </linearGradient>
  </defs>

  <style>
    .card-bg {
      fill: url(#cardGrad);
      stroke: #313244;
      stroke-width: 1.5;
      rx: 16;
    }
    .text-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 700;
      fill: #cba6f7;
      letter-spacing: -0.2px;
    }
    .text-subtitle {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      fill: #89b4fa;
    }
    .text-body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      fill: #cdd6f4;
    }
    .text-muted {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      fill: #6c7086;
    }
    .mono {
      font-family: "JetBrains Mono", "Fira Code", "Courier New", monospace;
    }
    .watermark {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 10px;
      font-weight: 600;
      fill: #6c7086;
      opacity: 0.65;
      transition: opacity 0.2s ease;
    }
    .watermark:hover {
      opacity: 1;
      fill: #cba6f7;
    }
    @keyframes pulse {
      0% { opacity: 0.7; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.05); }
      100% { opacity: 0.7; transform: scale(1); }
    }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    .cursor {
      animation: blink 1s infinite;
    }
    
  </style>

  <!-- Base Card -->
  <rect x="1" y="1" width="538" height="268" class="card-bg" />

  <!-- Inner Content -->
  
    <!-- Terminal Header Window Bar -->
    <rect x="1" y="1" width="538" height="32" rx="16" fill="#11111b" />
    <!-- Fix rounded bottom on header -->
    <rect x="1" y="16" width="538" height="16" fill="#11111b" />

    <!-- Terminal Window Controls -->
    <g transform="translate(18, 12)">
      <circle cx="0" cy="5" r="5" fill="#ff5f56" />
      <circle cx="16" cy="5" r="5" fill="#ffbd2e" />
      <circle cx="32" cy="5" r="5" fill="#27c93f" />
    </g>

    <!-- Terminal Title -->
    <text x="270" y="21" text-anchor="middle" class="text-muted mono" font-size="11" font-weight="500">
      octocat@starstruck: ~ (zsh)
    </text>

    <!-- Terminal Body -->
    <g transform="translate(26, 52)" class="mono">
      <!-- Left Column: Stylized Terminal Logo -->
      <g transform="translate(4, 10)">
        <rect width="64" height="64" rx="12" fill="#1e1e2e" stroke="#313244" stroke-width="1.5" />
        <text x="32" y="38" text-anchor="middle" fill="#cba6f7" font-size="28" font-weight="800">&gt;_</text>
        <text x="32" y="54" text-anchor="middle" fill="#a6e3a1" font-size="9" font-weight="700">DEV</text>
      </g>

      <!-- Right Column: Neofetch Output -->
      <g transform="translate(90, 0)">
        <text x="0" y="16" font-size="13" font-weight="700" fill="#cba6f7">
          octocat<tspan fill="#6c7086">@github</tspan>
        </text>
        <line x1="0" y1="24" x2="390" y2="24" stroke="#313244" stroke-width="1" stroke-dasharray="3 3" />

        <g transform="translate(0, 42)" font-size="12">
          <text x="0" y="0" fill="#89b4fa" font-weight="600">ROLE:</text>
          <text x="80" y="0" fill="#cdd6f4">🏹 Bugbane Hunter</text>

          <text x="0" y="20" fill="#89b4fa" font-weight="600">LEVEL:</text>
          <text x="80" y="20" fill="#a6e3a1">32 <tspan fill="#cba6f7">██████████░░</tspan> <tspan fill="#6c7086">(80%)</tspan></text>

          <text x="0" y="40" fill="#89b4fa" font-weight="600">STARS:</text>
          <text x="80" y="40" fill="#cdd6f4">420 ⭐ <tspan fill="#6c7086">(PRs: 68 🚀)</tspan></text>

          <text x="0" y="60" fill="#89b4fa" font-weight="600">COMMITS:</text>
          <text x="80" y="60" fill="#cdd6f4">842 ⚡ <tspan fill="#6c7086">(Streak: 19d 🔥)</tspan></text>

          <text x="0" y="80" fill="#89b4fa" font-weight="600">LANGS:</text>
          <text x="80" y="80" fill="#cdd6f4">TypeScript, Rust, Python</text>

          <text x="0" y="102" fill="#cba6f7" font-weight="700">&gt;</text>
          <text x="14" y="102" fill="#a6e3a1">Ready to ship.<tspan class="cursor" fill="#cba6f7">█</tspan></text>
        </g>
      </g>
    </g>
  

  <!-- Watermark & Backlink -->
  
      <g transform="translate(420, 252)">
        <a href="https://github.com/AkulTyagi/StarStruck" target="_blank">
          <text class="watermark" x="0" y="0">⚡ StarStruck</text>
        </a>
      </g>
    
</svg>