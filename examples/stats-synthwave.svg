<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 230" width="500" height="230" role="img" aria-label="GitHub Profile Card">
  <defs>
    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1025" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#241734" stop-opacity="0.98" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff7edb" />
      <stop offset="100%" stop-color="#36f9f6" />
    </linearGradient>

    <!-- XP Bar Gradient -->
    <linearGradient id="xpGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#36f9f6" />
      <stop offset="50%" stop-color="#ff7edb" />
      <stop offset="100%" stop-color="#fede5d" />
    </linearGradient>
  </defs>

  <style>
    .card-bg {
      fill: url(#cardGrad);
      stroke: #fe4450;
      stroke-width: 1.5;
      rx: 16;
    }
    .text-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 700;
      fill: #ff7edb;
      letter-spacing: -0.2px;
    }
    .text-subtitle {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      fill: #36f9f6;
    }
    .text-body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      fill: #f3e7fc;
    }
    .text-muted {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      fill: #8d79a5;
    }
    .mono {
      font-family: "JetBrains Mono", "Fira Code", "Courier New", monospace;
    }
    .watermark {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 10px;
      font-weight: 600;
      fill: #8d79a5;
      opacity: 0.65;
      transition: opacity 0.2s ease;
    }
    .watermark:hover {
      opacity: 1;
      fill: #ff7edb;
    }
    @keyframes pulse {
      0% { opacity: 0.7; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.05); }
      100% { opacity: 0.7; transform: scale(1); }
    }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    .cursor {
      animation: blink 1s infinite;
    }
    
  </style>

  <!-- Base Card -->
  <rect x="1" y="1" width="498" height="228" class="card-bg" />

  <!-- Inner Content -->
  
    <!-- Header -->
    <g transform="translate(28, 24)">
      <text x="0" y="18" class="text-title" font-size="18">The Octocat <tspan class="text-muted" font-size="13" font-weight="400">@octocat</tspan></text>
      <text x="0" y="38" class="text-subtitle" font-size="12" font-weight="600">🏹 Bugbane Hunter · Level 32</text>
    </g>

    <!-- Bento Grid Container -->
    <g transform="translate(28, 76)">
      <!-- Box 1: Stars -->
      <g transform="translate(0, 0)">
        <rect width="104" height="110" rx="14" fill="#1a1025" stroke="#fe4450" stroke-width="1.2" />
        <circle cx="28" cy="28" r="14" fill="#241734" />
        <text x="28" y="33" text-anchor="middle" font-size="13">⭐</text>
        <text x="16" y="74" class="text-title mono" font-size="22">420</text>
        <text x="16" y="94" class="text-muted" font-size="11" font-weight="600">STARS</text>
      </g>

      <!-- Box 2: Commits -->
      <g transform="translate(114, 0)">
        <rect width="104" height="110" rx="14" fill="#1a1025" stroke="#fe4450" stroke-width="1.2" />
        <circle cx="28" cy="28" r="14" fill="#241734" />
        <text x="28" y="33" text-anchor="middle" font-size="13">⚡</text>
        <text x="16" y="74" class="text-title mono" font-size="22">842</text>
        <text x="16" y="94" class="text-muted" font-size="11" font-weight="600">COMMITS</text>
      </g>

      <!-- Box 3: PRs -->
      <g transform="translate(228, 0)">
        <rect width="104" height="110" rx="14" fill="#1a1025" stroke="#fe4450" stroke-width="1.2" />
        <circle cx="28" cy="28" r="14" fill="#241734" />
        <text x="28" y="33" text-anchor="middle" font-size="13">🚀</text>
        <text x="16" y="74" class="text-title mono" font-size="22">68</text>
        <text x="16" y="94" class="text-muted" font-size="11" font-weight="600">PRS</text>
      </g>

      <!-- Box 4: Repos & Followers -->
      <g transform="translate(342, 0)">
        <rect width="102" height="110" rx="14" fill="#1a1025" stroke="#fe4450" stroke-width="1.2" />
        <circle cx="28" cy="28" r="14" fill="#241734" />
        <text x="28" y="33" text-anchor="middle" font-size="13">📦</text>
        <text x="16" y="74" class="text-title mono" font-size="22">24</text>
        <text x="16" y="94" class="text-muted" font-size="11" font-weight="600">REPOS</text>
      </g>
    </g>
  

  <!-- Watermark & Backlink -->
  
      <g transform="translate(380, 212)">
        <a href="https://github.com/AkulTyagi/StarStruck" target="_blank">
          <text class="watermark" x="0" y="0">⚡ StarStruck</text>
        </a>
      </g>
    
</svg>