<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 260" width="540" height="260" role="img" aria-label="GitHub Profile Card">
  <defs>
    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#21222c" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#282a36" stop-opacity="0.98" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff79c6" />
      <stop offset="100%" stop-color="#bd93f9" />
    </linearGradient>

    <!-- XP Bar Gradient -->
    <linearGradient id="xpGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#bd93f9" />
      <stop offset="50%" stop-color="#ff79c6" />
      <stop offset="100%" stop-color="#50fa7b" />
    </linearGradient>
  </defs>

  <style>
    .card-bg {
      fill: url(#cardGrad);
      stroke: #6272a4;
      stroke-width: 1.5;
      rx: 16;
    }
    .text-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 700;
      fill: #ff79c6;
      letter-spacing: -0.2px;
    }
    .text-subtitle {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      fill: #bd93f9;
    }
    .text-body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      fill: #f8f8f2;
    }
    .text-muted {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      fill: #6272a4;
    }
    .mono {
      font-family: "JetBrains Mono", "Fira Code", "Courier New", monospace;
    }
    .watermark {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 10px;
      font-weight: 600;
      fill: #6272a4;
      opacity: 0.65;
      transition: opacity 0.2s ease;
    }
    .watermark:hover {
      opacity: 1;
      fill: #ff79c6;
    }
    @keyframes pulse {
      0% { opacity: 0.7; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.05); }
      100% { opacity: 0.7; transform: scale(1); }
    }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    .cursor {
      animation: blink 1s infinite;
    }
    
  </style>

  <!-- Base Card -->
  <rect x="1" y="1" width="538" height="258" class="card-bg" />

  <!-- Inner Content -->
  
    <!-- Header: Avatar Crest & Title -->
    <g transform="translate(30, 28)">
      <!-- Level Crest Badge -->
      <g transform="translate(0, 2)">
        <circle cx="28" cy="28" r="28" fill="#21222c" stroke="url(#accentGrad)" stroke-width="2.5" filter="url(#glow)" />
        <text x="28" y="24" text-anchor="middle" class="text-muted" font-size="9" font-weight="700">LVL</text>
        <text x="28" y="42" text-anchor="middle" class="text-title" font-size="18" font-weight="800">32</text>
      </g>

      <!-- Player Info -->
      <g transform="translate(72, 14)">
        <text x="0" y="16" class="text-title" font-size="18">The Octocat <tspan class="text-muted" font-size="13" font-weight="400">@octocat</tspan></text>
        <g transform="translate(0, 26)">
          <text x="0" y="12" class="text-subtitle" font-size="13" font-weight="600">🏹 Bugbane Hunter</text>
          <text x="380" y="12" text-anchor="end" class="text-muted mono" font-size="11">XP: 582 / 728 (80%)</text>
        </g>
      </g>
    </g>

    <!-- XP Progress Bar -->
    <g transform="translate(32, 98)">
      <rect width="476" height="10" rx="5" fill="#21222c" stroke="#6272a4" stroke-width="1" />
      <rect width="380" height="10" rx="5" fill="url(#xpGrad)" filter="url(#glow)" />
    </g>

    <!-- Stat Grid Bento -->
    <g transform="translate(32, 122)">
      <!-- Stars -->
      <g transform="translate(0, 0)">
        <rect width="112" height="66" rx="10" fill="#21222c" stroke="#6272a4" stroke-width="1" />
        <text x="14" y="26" font-size="14">⭐</text>
        <text x="36" y="26" class="text-muted" font-size="11" font-weight="600">STARS</text>
        <text x="14" y="52" class="text-title mono" font-size="20">420</text>
      </g>

      <!-- Commits -->
      <g transform="translate(121, 0)">
        <rect width="112" height="66" rx="10" fill="#21222c" stroke="#6272a4" stroke-width="1" />
        <text x="14" y="26" font-size="14">⚡</text>
        <text x="36" y="26" class="text-muted" font-size="11" font-weight="600">COMMITS</text>
        <text x="14" y="52" class="text-title mono" font-size="20">842</text>
      </g>

      <!-- PRs -->
      <g transform="translate(242, 0)">
        <rect width="112" height="66" rx="10" fill="#21222c" stroke="#6272a4" stroke-width="1" />
        <text x="14" y="26" font-size="14">🚀</text>
        <text x="36" y="26" class="text-muted" font-size="11" font-weight="600">PRS</text>
        <text x="14" y="52" class="text-title mono" font-size="20">68</text>
      </g>

      <!-- Repos -->
      <g transform="translate(363, 0)">
        <rect width="113" height="66" rx="10" fill="#21222c" stroke="#6272a4" stroke-width="1" />
        <text x="14" y="26" font-size="14">📦</text>
        <text x="36" y="26" class="text-muted" font-size="11" font-weight="600">REPOS</text>
        <text x="14" y="52" class="text-title mono" font-size="20">24</text>
      </g>
    </g>

    <!-- Badges Container -->
    
        <g transform="translate(32, 205)">
          <rect width="145" height="26" rx="8" fill="#282a36" stroke="#6272a4" stroke-width="1" />
          <text x="12" y="17" class="text-body" font-size="12">⭐</text>
          <text x="32" y="17" class="text-subtitle" font-size="11" font-weight="600">Starstruck</text>
        </g>
      
        <g transform="translate(187, 205)">
          <rect width="145" height="26" rx="8" fill="#282a36" stroke="#6272a4" stroke-width="1" />
          <text x="12" y="17" class="text-body" font-size="12">⚡</text>
          <text x="32" y="17" class="text-subtitle" font-size="11" font-weight="600">Century Committer</text>
        </g>
      
        <g transform="translate(342, 205)">
          <rect width="145" height="26" rx="8" fill="#282a36" stroke="#6272a4" stroke-width="1" />
          <text x="12" y="17" class="text-body" font-size="12">🚀</text>
          <text x="32" y="17" class="text-subtitle" font-size="11" font-weight="600">PR Machine</text>
        </g>
      
  

  <!-- Watermark & Backlink -->
  
      <g transform="translate(420, 242)">
        <a href="https://github.com/AkulTyagi/StarStruck" target="_blank">
          <text class="watermark" x="0" y="0">⚡ StarStruck</text>
        </a>
      </g>
    
</svg>